name: Weekly Convey RPM updates

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if source and packaging are unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - convey.spec.in
      - source.py.in
      - weekly.py
      - test_weekly.py
      - requirements.txt
      - '.github/workflows/upstream.yml'

permissions:
  contents: read

concurrency:
  group: convey-copr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install COPR client and test the scheduler
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest -v
      - name: Check upstream and wait for COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_CONFIG_FILE: ${{ runner.temp }}/convey-copr-config
          FORCE: ${{ inputs.force == true }}
        run: |
          test -n "$COPR_CONFIG" || { echo 'Missing COPR_CONFIG repository secret'; exit 1; }
          umask 077
          trap 'rm -f "$COPR_CONFIG_FILE"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$COPR_CONFIG_FILE"
          unset COPR_CONFIG
          args=(--wait)
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          .venv/bin/python weekly.py "${args[@]}"

  keep-schedule-active:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record monthly activity to prevent the 60-day schedule suspension
        run: |
          month=$(date -u +%Y-%m)
          previous=$(cat .github/last-scheduled-check 2>/dev/null || true)
          if [[ "$month" != "$previous" ]]; then
            printf '%s\n' "$month" > .github/last-scheduled-check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/last-scheduled-check
            git commit -m 'Record monthly upstream check to keep scheduling active'
            git push
          fi
